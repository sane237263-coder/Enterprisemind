worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    error_log /dev/stderr warn;
    access_log /dev/stdout;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $host $edge_approved_host {
        default '';
        include /tmp/edge-host-map.conf;
    }

    # The server-level Cache-Control header is computed from the final URI,
    # including SPA internal redirects. Empty values leave upstream API
    # cache directives intact.
    map "$status:$uri" $edge_cache_control {
        default no-cache;
        "~^(200|206|304):/assets/.+-[A-Za-z0-9_-]{8,}[.][A-Za-z0-9]+$" "public, max-age=31536000, immutable";
        "~^[0-9][0-9][0-9]:/api/" '';
        "~^[0-9][0-9][0-9]:/health/(live|ready)$" '';
    }

    upstream enterprise_mind_api {
        server api:8000;
        keepalive 16;
    }

    # Port 80 exists only to perform the explicit HTTPS redirect.  The edge
    # service is the only Compose service that publishes host ports.
    server {
        listen 8080;
        server_name _;
        if ($edge_approved_host = '') {
            return 421;
        }
        return 308 @EM_PUBLIC_ORIGIN@$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $edge_cache_control always;

        client_max_body_size 100m;

        if ($edge_approved_host = '') {
            return 421;
        }

        location = /health/live {
            proxy_pass http://enterprise_mind_api;
            proxy_set_header Host $edge_approved_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /health/ready {
            proxy_pass http://enterprise_mind_api;
            proxy_set_header Host $edge_approved_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/ws/ {
            proxy_pass http://enterprise_mind_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $edge_approved_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location /api/ {
            # Match application.production.yaml: 10 files * 100 MiB, plus 1 MiB multipart overhead.
            client_max_body_size 1001m;
            proxy_pass http://enterprise_mind_api;
            proxy_http_version 1.1;
            proxy_set_header Host $edge_approved_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 10m;
            proxy_send_timeout 10m;
        }

        location ^~ /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
